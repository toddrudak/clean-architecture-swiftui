name: CI
on:
  pull_request:
  push:
    branches: [master]
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: >
          xcodebuild test -project CountriesSwiftUI.xcodeproj -scheme CountriesSwiftUI
          -destination 'platform=iOS Simulator,name=iPhone 16'
          -skipPackagePluginValidation -skipMacroValidation
